name: Validate Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.yml"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal and external links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
          config-file: ".mlc-config.json"
          folder-path: "."
          file-extension: ".md"

  placeholder-check:
    name: Placeholder Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect unfilled placeholders outside templates/
        # Templates intentionally contain [DATE], [NAME], etc.
        # Checklists and tooling docs should never have them.
        run: |
          set +e
          HITS=$(grep -rn --include="*.md" \
            -E '\[[A-Z][A-Z ]{2,}\]' \
            checklists/ tooling-decisions/ case-studies/ README.md CONTRIBUTING.md 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "::error::Unfilled placeholder(s) found outside the templates/ directory:"
            echo "$HITS"
            exit 1
          fi
          echo "No placeholder leaks detected."
