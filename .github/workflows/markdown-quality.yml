name: Markdown Quality

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-quality.yml'
      - '.markdownlint-cli2.jsonc'
      - '.typos.toml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-quality.yml'
      - '.markdownlint-cli2.jsonc'
      - '.typos.toml'
  schedule:
    # Weekly external-link scan every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  # Blocks PRs on broken internal (relative) links.
  # External URLs are excluded so transient 429s / DNS hiccups never block a merge.
  internal-links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Check internal links
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 \
            | xargs -0 -n1 markdown-link-check \
                --config .github/markdown-link-check-internal.json \
                --verbose

  # Blocks PRs on Markdown style/structure problems (per .markdownlint-cli2.jsonc).
  # Stylistic rules ill-suited to prose docs are disabled in that config.
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2

  # Blocks PRs that leak editorial leftovers into the docs: unresolved merge
  # conflict markers and TODO/FIXME/XXX placeholders. Intentional bracket
  # placeholders ([CLIENT NAME], [DATE], ...) and <!-- NOTE: --> blocks are NOT
  # flagged — they are part of how the templates are meant to be used.
  editorial-leftovers:
    name: Editorial leftover check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for conflict markers and TODO/FIXME
        run: |
          # Match real conflict markers ("<<<<<<< ", "=======", ">>>>>>> ") and
          # TODO/FIXME/XXX tokens. -E extended regex; -n shows line numbers.
          if grep -rnE '^(<{7}|={7}|>{7})( |$)|\b(TODO|FIXME|XXX)\b' \
               --include='*.md' . ; then
            echo "::error::Editorial leftovers found (conflict markers or TODO/FIXME). Resolve before merging."
            exit 1
          fi
          echo "No editorial leftovers found."

  # Blocks PRs on spelling errors in markdown files.
  # Domain-specific acronyms (BA, EHR, OT) and compound prefixes (mis-)
  # are whitelisted in .typos.toml so only genuine typos fail the gate.
  spell-check:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run typos
        uses: crate-ci/typos@v1
        with:
          config: .typos.toml

  # Runs on a weekly schedule only; opens a GitHub issue when external links rot.
  # Not a PR gate — external URLs can be flaky and are not the contributor's problem to fix.
  external-links:
    name: External link check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Check external links
        id: link_check
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 \
            | xargs -0 -n1 markdown-link-check \
                --config .github/markdown-link-check-external.json \
                --verbose
        continue-on-error: true

      - name: Open issue on broken external links
        if: steps.link_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Broken external links detected (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              '## Weekly external link scan failed',
              '',
              'One or more external URLs in the markdown files are returning errors.',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check the run logs for the specific broken links and open a PR to fix or replace them.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });

            // Avoid duplicate open issues for the same problem
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links'],
              });
            }

  # Runs on a weekly schedule only; opens a GitHub issue when a "Last
  # reviewed: Qn YYYY" stamp is older than the staleness threshold. Content
  # like vendor/pricing comparisons ages fast (see CONTRIBUTING.md's
  # "Accurate" editorial bar) and nothing else in this repo catches drift.
  stale-content:
    name: Content freshness check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Scan for stale "Last reviewed" dates
        id: staleness_check
        run: |
          THRESHOLD_MONTHS=12
          NOW_EPOCH=$(date -u +%s)
          REPORT_FILE=stale-content-report.txt
          : > "$REPORT_FILE"

          while IFS= read -r match; do
            file="${match%%:*}"
            rest="${match#*:}"
            line="${rest%%:*}"
            content="${rest#*:}"
            quarter=$(echo "$content" | grep -oE 'Q[1-4]')
            year=$(echo "$content" | grep -oE '[0-9]{4}')
            case "$quarter" in
              Q1) month=03 ;;
              Q2) month=06 ;;
              Q3) month=09 ;;
              Q4) month=12 ;;
            esac
            review_epoch=$(date -u -d "${year}-${month}-01" +%s)
            age_months=$(( (NOW_EPOCH - review_epoch) / 2592000 ))

            if [ "$age_months" -ge "$THRESHOLD_MONTHS" ]; then
              echo "::warning file=${file},line=${line}::Stale review date (${quarter} ${year}, ~${age_months} months old)"
              echo "- \`${file}\` (line ${line}): ${quarter} ${year} — ~${age_months} months old" >> "$REPORT_FILE"
            fi
          done < <(grep -rnE '\*\*Last reviewed:\*\* Q[1-4] [0-9]{4}' --include='*.md' .)

          if [ -s "$REPORT_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No stale content found."
          fi

      - name: Open issue on stale content
        if: steps.staleness_check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('stale-content-report.txt', 'utf8');

            const title = `Stale "Last reviewed" content detected (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              '## Weekly content freshness scan found stale docs',
              '',
              'The following files have a "Last reviewed" date older than 12 months:',
              '',
              report,
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the content for accuracy (pricing, product features, positioning) and bump the "Last reviewed" date, per CONTRIBUTING.md\'s editorial bar.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-content',
            });

            // Avoid duplicate open issues for the same problem
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['stale-content'],
              });
            }
